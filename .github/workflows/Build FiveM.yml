name: Build FiveM

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install setuptools (for distutils)
      run: python -m pip install --upgrade pip setuptools

    - name: Setup Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Ensure Yarn is installed
      run: npm install -g yarn

    # 可选：安装 MSYS2，如果需要用到原生 make 工具链
    # - name: Install MSYS2
    #   uses: msys2/setup-msys2@v2
    #   with:
    #     update: true

    - name: Run prebuild script
      shell: cmd
      run: prebuild

    - name: Download Chrome for build
      shell: cmd
      run: tools\fxd\fxd.exe get-chrome

    - name: Generate code for FiveM
      shell: cmd
      run: tools\fxd\fxd.exe gen -game five

    - name: Generate Visual Studio solution
      shell: cmd
      run: tools\fxd\fxd.exe vs -game five

    - name: List all sln files
      shell: cmd
      run: dir /s /b *.sln

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild (FiveM)
      shell: cmd
      run: |
        REM 注意：下方 sln 路径以实际生成为准，通常为 code\fivem.sln
        msbuild code\fivem.sln /p:Configuration=Release /p:Platform=x64 /m
