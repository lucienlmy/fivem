name: CI Build all products-build_Joy

on:
  workflow_dispatch:      # 👈 保留手动运行功能
  push:                   # 👈 添加 push 触发条件
    branches:
      - Joy               # 👈 仅在推送 Joy 分支时触发
  workflow_call:          # 👈 保留可复用特性

permissions:
  packages: read

jobs:
  build_all:
    strategy:
      matrix:
        builds:
          - [ FiveM,  five,   x64 ]
          - [ RedM,   rdr3,   x64 ]
          - [ Server, server, x64 ]
    name: ${{ matrix.builds[0] }}
    runs-on: windows-latest
    env:
      PROGRAM: ${{ matrix.builds[1] }}
      PLATFORM: ${{ matrix.builds[2] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare build folders and env
        shell: pwsh
        run: |
          $root = "C:\b"
          $env:ROOT = $root
          $env:ROOT_REPO = "$root\$env:PROGRAM"
          $env:ROOT_DEP = "$root\dep"
          $env:JOB_SLOTS = 2
          echo "ROOT_REPO=$($env:ROOT_REPO)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ROOT_DEP=$($env:ROOT_DEP)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "JOB_SLOTS=$($env:JOB_SLOTS)" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path $env:ROOT_REPO | Out-Null
          New-Item -ItemType Directory -Force -Path $env:ROOT_DEP | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\*" $env:ROOT_REPO

      - name: Compile
        shell: pwsh
        run: |
          cd $env:ROOT_REPO
          $buildScript = ".github/workflows/ci/build_windows.sh"
          if (!(Test-Path $buildScript)) {
            Write-Error "$buildScript not found!"
            exit 1
          }
          bash $buildScript "$env:ROOT_DEP" $env:JOB_SLOTS $env:PLATFORM

      - name: List all files under project root and save to all_files.txt
        shell: pwsh
        run: |
          Write-Host "==== All files under $env:ROOT_REPO ===="
          Get-ChildItem -Path $env:ROOT_REPO -Recurse | ForEach-Object {
            Write-Host $_.FullName
          }
          Get-ChildItem -Path $env:ROOT_REPO -Recurse | Select-Object -ExpandProperty FullName | Set-Content "$env:GITHUB_WORKSPACE\all_files.txt"

      - name: List all exe files under project root and save to all_exe_files.txt
        shell: pwsh
        run: |
          Write-Host "==== All .exe files under $env:ROOT_REPO ===="
          $exeFiles = Get-ChildItem -Path $env:ROOT_REPO -Recurse -Filter *.exe
          foreach ($file in $exeFiles) {
            Write-Host $file.FullName
          }
          $exeFiles | Select-Object -ExpandProperty FullName | Set-Content "$env:GITHUB_WORKSPACE\all_exe_files.txt"

      - name: Collect all exe files and file lists to artifact_output
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifact_output"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          # 复制清单文件
          Copy-Item "$env:GITHUB_WORKSPACE\all_files.txt" $artifactDir -Force
          Copy-Item "$env:GITHUB_WORKSPACE\all_exe_files.txt" $artifactDir -Force
          # 复制所有exe
          $exeFiles = Get-Content "$env:GITHUB_WORKSPACE\all_exe_files.txt"
          foreach ($exe in $exeFiles) {
            if (Test-Path $exe) {
              Copy-Item $exe $artifactDir -Force
            } else {
              Write-Host "Not found: $exe"
            }
          }
          Write-Host "Files in artifact_output:"
          Get-ChildItem $artifactDir

      - name: Upload all found exe files and file lists as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.builds[0] }}-exe-and-list
          path: artifact_output/*

      - name: Upload all files under project root (保持原始目录结构)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.builds[0] }}-all-root-files
          path: |
            ${{ env.ROOT_REPO }}/**

      - name: Collect all dll files under release directory to dll_release_output
        if: ${{ matrix.builds[0] != 'Server' }}
        shell: pwsh
        run: |
          $dllSource = "C:\b\five\code\bin\five\release"
          $dllTarget = "$env:GITHUB_WORKSPACE\dll_release_output"
          New-Item -ItemType Directory -Force -Path $dllTarget | Out-Null
          if (Test-Path $dllSource) {
            $dllFiles = Get-ChildItem -Path $dllSource -Recurse -Filter *.dll
            $dllFiles | Select-Object -ExpandProperty FullName | Set-Content "$env:GITHUB_WORKSPACE\all_dll_files.txt"
            foreach ($dll in $dllFiles) {
              if (Test-Path $dll.FullName) {
                Copy-Item $dll.FullName $dllTarget -Force
              }
            }
            Write-Host "Files in dll_release_output:"
            Get-ChildItem $dllTarget
          } else {
            Write-Host "$dllSource does not exist, skip collecting dlls."
          }

      - name: Upload all dll files under release directory
        if: ${{ matrix.builds[0] != 'Server' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.builds[0] }}-dll-release
          path: dll_release_output/*
